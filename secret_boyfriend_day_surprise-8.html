<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Secret 👀</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:Arial, sans-serif; background:linear-gradient(135deg,#fff1f5,#ffe3ec);
    color:#4b2633; padding:20px;
  }
  .card{
    width:min(430px,100%); background:#fffafa; border-radius:28px; padding:28px 22px;
    text-align:center; box-shadow:0 15px 45px rgba(110,45,70,.18);
  }
  .heart{font-size:45px}
  h1{font-size:26px;margin:10px 0 12px}
  p{font-size:17px;line-height:1.5}
  .progress{font-size:13px;color:#a45d77;margin-bottom:14px}
  button{
    width:100%; border:0; border-radius:16px; padding:14px 12px; margin:7px 0;
    font-size:16px; cursor:pointer; background:#f7c5d5; color:#552638;
    transition:.2s;
  }
  button:hover{transform:scale(1.02);background:#f3adc5}
  .wrong{font-size:19px;font-weight:bold;color:#a83d62;margin:15px 0 5px}
  .correct{font-size:21px;font-weight:bold;color:#b12d62;margin:15px 0 5px}
  .next{background:#5f2942;color:white;margin-top:12px}
  .hidden{display:none}
  .final{font-size:21px;font-weight:bold;line-height:1.6}
  .small{font-size:14px;color:#946276}
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const questions = [
 {q:"Ney enea adym aait kndth enn aan?", opts:["November 3","November 4","November 2"], ans:[0]},
 {q:"Ney eniku tanna ettvum precious gift?", opts:["Letter","Chocolate","Watch"], ans:[0]},
 {q:"Njn vazhk idumbol ettvum kooduthl paryunath?", opts:["Break up","Patch up","I hate you"], ans:[2]},
 {q:"Are you happy with me?", opts:["Yes","No","Ok ok"], ans:[0]},
 {q:"Nammal adym ait kndpo ula dress code enth arunu?", opts:["Black","White","Red"], ans:[0]},
 {q:"Namudr marriage kazhina year?", opts:["2022","2021"], ans:[0]},
 {q:"Njn ninte vitil adym ait vnna year?", opts:["2023","2022","2024"], ans:[0]},
 {q:"Nmude kutide name?", opts:["Ella","Eva","Ein"], ans:[0]},
 {q:"How many times namml kiss cheythit und?", opts:["11-12","13-15","9-10"], ans:[0]},
 {q:"Will you marry me?", opts:["Yes","Ja","Of course"], ans:[0,1,2]}
];

let i=0, score=0;

function renderIntro(){
 document.getElementById("app").innerHTML = `
   <div class="heart">🎀</div>
   <h1>Oru small surprise 👀</h1>
   <p>Open cheyyano? 🤭</p>
   <button onclick="start()">YES 💗</button>
 `;
}
function start(){ i=0; score=0; renderQuestion(); }

function renderQuestion(){
 const x=questions[i];
 document.getElementById("app").innerHTML = `
   <div class="progress">Question ${i+1} / 10</div>
   <div class="heart">💌</div>
   <h1>${x.q}</h1>
   ${x.opts.map((o,n)=>`<button onclick="answer(${n})">${o}</button>`).join("")}
 `;
}
function answer(n){
 const x=questions[i];
 const app=document.getElementById("app");
 if(x.ans.includes(n)){
   score++;
   app.innerHTML = `
     <div class="heart">💋</div>
     <div class="correct">Ummmaaa 💋</div>
     <p>Correct answer! 😗</p>
     <button class="next" onclick="next()">Next ➜</button>
   `;
 }else{
   app.innerHTML = `
     <div class="heart">🥹</div>
     <div class="wrong">Kollam pucheaa 😭</div>
     <p>Wrong answer 😭<br>Onnu koode nokkiye...</p>
     <button class="next" onclick="renderQuestion()">Try again 👀</button>
   `;
 }
}
function next(){
 i++;
 if(i<questions.length) renderQuestion();
 else renderFinal();
}
function renderFinal(){
 document.getElementById("app").innerHTML = `
   <div class="heart">🎀💋🎀</div>
   <h1>10 / 10 Correct! 🥹❤️</h1>
   <p>You actually know everything about us 😭🫶🏻</p>
   <button class="next" onclick="unlock()">Unlock the surprise 👀</button>
 `;
}
function unlock(){
 document.getElementById("app").innerHTML = `
   <div class="heart">💋🎀💋</div>
   <h1>HAPPY BOYFRIEND DAY</h1>
   <div class="final">
     Happy boyfriend day my dear pucheaa 💋💋🤭🤭🤭🤭🤭🤭🤭🤭🤭🤭🤭🤭🤭🤭<br>
     lubbbbbbbbbbb uuuuuuuu 🎀😗😗😗😗
   </div>
 `;
}
renderIntro();
</script>
</body>
</html>
